services:
  ufm-ib-exporter:
    build: .
    image: ${IMAGE:-ufm-ib-exporter:latest}
    container_name: ufm-ib-exporter
    environment:
      UFM_HOST: "${UFM_HOST:-172.16.30.33}"
      UFM_USERNAME: "${UFM_USERNAME:-admin}"
      UFM_PASSWORD: "${UFM_PASSWORD:?请在 .env 设置 UFM_PASSWORD}"   # UFM REST 凭据,从 .env 注入,不入库
      LISTEN_PORT: "9627"
      TIMEOUT: "30"
      # 可选基线(用于「整节点从 Fabric 消失」检测,缺席节点补 0):
      # UFM_NODE_PREFIX: "B300"
      # UFM_EXPECTED_NODES: "32"
      # UFM_PORTS_PER_NODE: "8"
    ports:
      - "9627:9627"                  # 供 Prometheus / 手动 curl 抓取
    restart: unless-stopped

    # —— 与既有监控栈集成的两种方式(二选一)——
    # A) 独立运行(默认):Prometheus 用 宿主IP:9627 抓(见 examples/prometheus-job.yml)。
    # B) 加入既有 b300-exporter 的 monitoring 网络,Prometheus 按容器名 ufm-ib-exporter:9627 抓:
    #    取消下面注释(external name 视你的 compose 项目名而定,常为 <项目目录名>_monitoring):
    # networks: [monitoring]
# networks:
#   monitoring:
#     external: true
#     name: b300-exporter_monitoring
