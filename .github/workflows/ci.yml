name: Rust checks and release
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Validate systemd unit against an installed test binary
        run: |
          sudo install -m 0755 target/debug/ufm-ib-exporter /usr/local/bin/ufm-ib-exporter
          systemd-analyze verify --man=no deploy/systemd/ufm-ib-exporter.service
      - name: Install a real Prometheus engine for integration checks
        shell: bash
        run: |
          set -euo pipefail
          version=3.12.0
          artifact="prometheus-${version}.linux-amd64.tar.gz"
          base="https://github.com/prometheus/prometheus/releases/download/v${version}"
          curl -fsSL "$base/$artifact" -o "$RUNNER_TEMP/$artifact"
          curl -fsSL "$base/sha256sums.txt" -o "$RUNNER_TEMP/prometheus-sha256sums.txt"
          cd "$RUNNER_TEMP"
          awk -v artifact="$artifact" '$2 == artifact' prometheus-sha256sums.txt | sha256sum --check --strict
          tar -xzf "$artifact"
          echo "PROMETHEUS_BINARY=$RUNNER_TEMP/prometheus-${version}.linux-amd64/prometheus" >> "$GITHUB_ENV"
          echo "PROMTOOL=$RUNNER_TEMP/prometheus-${version}.linux-amd64/promtool" >> "$GITHUB_ENV"
      - run: $PROMTOOL check rules examples/alerts.yml examples/telemetry-alerts.yml
      - run: $PROMTOOL test rules tests/telemetry-rules.test.yml
      - run: python3 tests/integration.py target/debug/ufm-ib-exporter
      - run: docker compose --env-file .env.example config --quiet
        working-directory: deploy/docker-compose
      - run: docker compose --env-file .env.example -f docker-compose.telemetry.yml config --quiet
        working-directory: deploy/docker-compose
      - run: docker build -t ufm-ib-exporter:ci .
      - run: docker run --rm --network none ufm-ib-exporter:ci --version
      - name: Exercise the non-root read-only container with synthetic upstreams
        run: UFM_TEST_DOCKER_IMAGE=ufm-ib-exporter:ci python3 tests/integration.py target/debug/ufm-ib-exporter

  release-metadata:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
      image_tags: ${{ steps.version.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and Docker Hub credential availability
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_TOKEN" || { echo 'Configure DOCKERHUB_TOKEN (or DOCKERHUB_PASSWORD) in Actions Secrets.' >&2; exit 1; }
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+(?:\.\d+)?', tag):
              raise SystemExit('Release tag must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH')
          version = tag[1:]
          if version.count('.') == 1:
              version += '.0'
          if version != tomllib.loads(Path('Cargo.toml').read_text())['package']['version']:
              raise SystemExit('Tag does not match Cargo.toml version')
          if not Path(f'docs/releases/{tag}.md').is_file():
              raise SystemExit('Add release notes at docs/releases/<tag>.md')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag={tag}\nversion={version}', file=output)
              tags = dict.fromkeys([f'willdockerhub/ufm-ib-exporter:{tag}', f'willdockerhub/ufm-ib-exporter:v{version}', 'willdockerhub/ufm-ib-exporter:latest'])
              print('image_tags<<IMAGE_TAGS\n' + '\n'.join(tags) + '\nIMAGE_TAGS', file=output)
          PY
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prevent replacement of a published release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag: context.ref.replace('refs/tags/', '')});
              if (!data.draft) core.setFailed('This version is already published; use a new version tag.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  binaries:
    needs: [test, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      CC: musl-gcc
      RUSTFLAGS: -C linker=rust-lld -C target-feature=+crt-static
      SOURCE_DATE_EPOCH: ${{ needs.release-metadata.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify static binary and exercise native TLS/HTTP behavior
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/ufm-ib-exporter"
          "$binary" --version
          if readelf -l "$binary" | grep -q INTERP; then echo 'Release binary is not static' >&2; exit 1; fi
          python3 tests/integration.py "$binary"
      - name: Package binary, configuration and deployment documentation
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p package dist
          install -m 0755 "target/$TARGET/release/ufm-ib-exporter" package/ufm-ib-exporter
          cp -a deploy docs examples grafana config.example.yaml README.md package/
          tar -C package --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - . | gzip -n > "dist/ufm-ib-exporter-$TAG-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  docker:
    needs: [binaries, release-metadata]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Prepare image context from release archives
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          context_dir="$RUNNER_TEMP/release-image"
          mkdir -p "$context_dir"
          cp deploy/Dockerfile.release "$context_dir/Dockerfile"
          cp config.example.yaml "$context_dir/"
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/extracted-$arch" "$context_dir/binaries/$arch"
            tar -xzf "dist/ufm-ib-exporter-$TAG-linux-$arch.tar.gz" -C "$RUNNER_TEMP/extracted-$arch"
            install -m 0755 "$RUNNER_TEMP/extracted-$arch/ufm-ib-exporter" "$context_dir/binaries/$arch/ufm-ib-exporter"
          done
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 release image for regression tests
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/release-image
          platforms: linux/amd64
          load: true
          tags: ufm-ib-exporter:release-test
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
      - name: Exercise the packaged static binary in the hardened container
        run: UFM_TEST_DOCKER_IMAGE=ufm-ib-exporter:release-test python3 tests/integration.py
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'willdockerhub' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Push multi-platform release image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/release-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.release-metadata.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
          build-args: SOURCE_DATE_EPOCH=${{ needs.release-metadata.outputs.epoch }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image

  github-release:
    needs: [binaries, docker, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Write digest and checksum manifests
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
          printf 'willdockerhub/ufm-ib-exporter@%s\n' "$DIGEST" > dist/docker-image.txt
          (cd dist && sha256sum *.tar.gz docker-image.txt > SHA256SUMS)
          cp "docs/releases/$TAG.md" "$RUNNER_TEMP/release-notes.md"
          printf '\nDocker image: `willdockerhub/ufm-ib-exporter@%s`\n' "$DIGEST" >> "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub Release without overwriting different assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Release is already published; refusing changes.' >&2; exit 1; }
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing-assets.txt"
          mkdir -p "$RUNNER_TEMP/existing-assets"
          for asset in dist/*; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" "$RUNNER_TEMP/existing-assets.txt"; then
              gh release download "$TAG" --pattern "$name" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$asset" "$RUNNER_TEMP/existing-assets/$name" || { echo "Refusing to overwrite different asset: $name" >&2; exit 1; }
            else
              gh release upload "$TAG" "$asset"
            fi
          done
          gh release edit "$TAG" --draft=false --latest
