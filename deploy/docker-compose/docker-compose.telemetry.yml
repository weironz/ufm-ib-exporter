# Telemetry-only profile at :9628 while REST is collected elsewhere.
# Do not run alongside another collector of these same telemetry sources.
services:
  ufm-ib-telemetry:
    extends:
      file: docker-compose.yml
      service: ufm-ib-exporter
    container_name: ufm-ib-telemetry
    environment:
      UFM_COLLECT_REST: "false"
      LISTEN_PORT: ${LISTEN_PORT:-9628}
