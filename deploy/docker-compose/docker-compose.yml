# Run from this directory after preparing config/exporter.local.yaml and .env.
services:
  ufm-ib-exporter:
    image: ${IMAGE:-willdockerhub/ufm-ib-exporter:v0.1.1}
    container_name: ufm-ib-exporter
    network_mode: host
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
    environment:
      UFM_CONFIG: /etc/ufm-ib-exporter/exporter.local.yaml
      UFM_PASSWORD: ${UFM_PASSWORD:-}
      LISTEN_ADDRESS: ${LISTEN_ADDRESS:-127.0.0.1}
      LISTEN_PORT: ${LISTEN_PORT:-9627}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Directory mount makes atomic file replacement visible to SIGHUP reload.
      - ${UFM_CONFIG_DIR:-./config}:/etc/ufm-ib-exporter:ro
      # Add a read-only CA mount + ca_file in YAML for self-signed UFM HTTPS.
    healthcheck:
      test: [CMD, /usr/local/bin/ufm-ib-exporter, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
