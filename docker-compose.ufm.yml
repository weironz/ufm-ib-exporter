# 在 UFM 主机上运行:读本机 telemetry loopback :9001(可选 :9002)→ 流式裁剪 → 在 UFM mgmt IP 暴露,
# 供 bastion 上的 Prometheus 抓。与 bastion 那份(采 REST up/down)互补,统一用 docker compose。
#
# 关键:network_mode: host
#   - 容器需读【宿主】的 127.0.0.1:9001(UFM telemetry 默认只绑 loopback);host 网络下容器内 127.0.0.1=宿主。
#   - 监听端口直接绑在 UFM 宿主网络(mgmt IP),bastion 用 172.16.30.33:9628 抓。
#
# UFM 无外网无法 build/pull,故复用已 load 的镜像(只取 python+依赖),业务脚本走【挂载】覆盖。
# 镜像来源: 在 bastion 上 `docker save willdockerhub/ufm-ib-exporter:<tag> | ssh UFM 'docker load'`。
# 用法(在 UFM 上): docker compose -f docker-compose.ufm.yml up -d
services:
  ufm-ib-telemetry:
    image: ${IMAGE:-willdockerhub/ufm-ib-exporter:2026.06.22}   # 已 load 到 UFM 的镜像(python+依赖)
    container_name: ufm-ib-telemetry
    network_mode: host                       # ← 读宿主 loopback :9001 + 直接对外暴露
    volumes:
      - ./ufm_exporter.py:/app/ufm_exporter.py:ro               # 挂新脚本,覆盖镜像内旧版(免 build)
    environment:
      LISTEN_PORT: "9628"                    # 在 UFM mgmt IP 上暴露;确认宿主未占用
      UFM_COLLECT_REST: "false"              # REST(up/down)由 bastion 那台采,这台只补 telemetry
      UFM_COLLECT_9001: "true"
      UFM_9001_URL: "http://127.0.0.1:9001/metrics"
      UFM_9001_INTERVAL: "180"               # BER 慢变量,180s 足够
      UFM_9001_NODE_FILTER: "B300|Q3400"     # 只留 B300 主机 + Q3400 交换机端口;空=全收
      UFM_COLLECT_9002: "false"              # 富/光学 1.26GB,默认关
    restart: unless-stopped
